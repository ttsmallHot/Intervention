# Train config — Qwen2.5-VL-3B + MMStar
model_type : qwen2_5vl
model_path : /code/Qwen2.5-VL-3B-Instruct

# Using the local parquet files we just generated via scripts/prepare_mmstar.py
train_data_path : /code/Intervention/data/mmstar/train.parquet
val_data_path   : /code/Intervention/data/mmstar/test.parquet

# Output directory for checkpoints
output_dir : /code/Intervention/checkpoints/qwen2_5_mmstar

# Plugin settings
mode : image
free_train : true
boost_strength_init : 0.0

# Hyperparameters
num_epochs : 15
batch_size : 4
learning_rate : 0.05
eval_every : 1
